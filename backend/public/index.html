<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KashPocket</title>
<style>
:root{--ink:#14213d;--paper:#f3f6f4;--line:#dde4e0;--mut:#5f6b7a;--pri:#0b7a6b;--g:#2f9e5b;--y:#e0a100;--r:#d64545}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink)}
[hidden]{display:none!important}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 18px;background:var(--ink);color:#fff}
header b{font-size:18px;margin-right:8px}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:none;color:#b9c3d6}
nav button.on{background:#fff;color:var(--ink)}
main{max-width:980px;margin:18px auto;padding:0 14px}
h2{margin:0 0 10px;font-size:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.grid .card{margin:0}
.k{color:var(--mut);font-size:13px}.v{font-size:24px;font-weight:700}
button{border:0;border-radius:6px;padding:7px 12px;background:var(--pri);color:#fff;font:inherit;cursor:pointer}
button.s{background:#e9eeeb;color:var(--ink)}button.d{background:#fbe5e5;color:var(--r)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
input,select{padding:7px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;max-width:100%}
form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--mut);font-weight:600;font-size:13px}
.row{display:flex;gap:24px;flex-wrap:wrap;align-items:center}
.pie{width:180px;height:180px;border-radius:50%;flex:none}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.sobres{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.env{position:relative;background:#fff;border:1px solid var(--line);border-radius:8px;padding:56px 14px 14px;overflow:hidden}
.env::before{content:"";position:absolute;inset:0 0 auto;height:44px;background:var(--c);clip-path:polygon(0 0,100% 0,50% 100%)}
.env h3{margin:0 0 4px;font-size:16px}
.bar{height:8px;background:#e9eeeb;border-radius:4px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--c)}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:#e9eeeb}
.verde{background:#dff3e6;color:#1d6b3d}.amarillo{background:#fbf0cc;color:#7a5b00}.rojo{background:#fbe0e0;color:#9c2323}
.alerta{border-left:4px solid var(--y)}
.in{color:var(--g)}.out{color:var(--r)}
#auth{max-width:340px;margin:70px auto}
#auth form{flex-direction:column;align-items:stretch}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:9px 16px;border-radius:6px;color:#fff;background:var(--r)}
#msg.ok{background:var(--pri)}
</style>
</head>
<body>
<div id="auth" class="card">
  <h2 id="at">Iniciar sesión</h2>
  <form id="fAuth">
    <input name="nombre" id="an" placeholder="Nombre" hidden>
    <input name="correo" type="email" placeholder="Correo" required>
    <input name="password" type="password" placeholder="Contraseña (mínimo 8 caracteres)" minlength="8" required>
    <button id="ab">Entrar</button>
    <button type="button" class="s" id="swap">Crear una cuenta</button>
  </form>
</div>
<div id="app" hidden>
  <header><b>KashPocket</b><nav id="nav"></nav><span id="who"></span><button class="s" id="out">Salir</button></header>
  <main id="view"></main>
</div>
<div id="msg" hidden></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n||0);
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let token=localStorage.getItem('kp_token'),me=null,mes=hoy().slice(0,7),reg=false,editTx=null;
const C={},A={},F={};

function toast(t,ok){const m=$('#msg');m.textContent=t;m.className=ok?'ok':'';m.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>m.hidden=true,3000)}
async function api(p,method='GET',body){
  const r=await fetch('/api'+p,{method,headers:{'Content-Type':'application/json',...(token&&{Authorization:'Bearer '+token})},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){if(token&&(r.status===401||/suspendida/.test(d.error||'')))logout();throw new Error(d.error||'Error del servidor')}
  return d;
}
const run=async(fn,ok)=>{try{await fn();if(ok)toast(ok,1)}catch(e){toast(e.message)}};
function logout(){token=null;me=null;localStorage.removeItem('kp_token');$('#app').hidden=true;$('#auth').hidden=false}

/* ---------- Autenticación ---------- */
$('#swap').onclick=()=>{reg=!reg;$('#an').hidden=!reg;$('#an').required=reg;$('#at').textContent=reg?'Crear cuenta':'Iniciar sesión';$('#ab').textContent=reg?'Registrarme':'Entrar';$('#swap').textContent=reg?'Ya tengo cuenta':'Crear una cuenta'};
$('#fAuth').onsubmit=e=>{e.preventDefault();run(async()=>{
  const f=Object.fromEntries(new FormData(e.target));
  if(reg)await api('/auth/register','POST',f);
  const d=await api('/auth/login','POST',{correo:f.correo,password:f.password});
  token=d.token;localStorage.setItem('kp_token',token);me=d.usuario;start();
})};
$('#out').onclick=logout;

const V={dashboard:vDash,cuentas:vCuentas,sobres:vSobres,mov:vMov,admin:vAdmin};
function start(){
  $('#auth').hidden=true;$('#app').hidden=false;$('#who').textContent=me.nombre;
  const t=[['dashboard','Resumen'],['cuentas','Cuentas'],['sobres','Sobres'],['mov','Movimientos']];
  if(me.rol==='admin')t.push(['admin','Administración']);
  $('#nav').innerHTML=t.map(([k,n])=>`<button data-t="${k}">${n}</button>`).join('');
  go('dashboard');
}
$('#nav').onclick=e=>{const b=e.target.closest('[data-t]');if(b)go(b.dataset.t)};
function go(t){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));run(()=>V[t]())}

$('#view').onclick=e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a](b.dataset.id)};
$('#view').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(F[e.target.id])F[e.target.id](f)};
$('#view').onchange=e=>{if(e.target.id==='tipo')cats()};

/* ---------- Resumen ---------- */
async function vDash(){
  const d=await api('/dashboard?mes='+mes),r=d.resumen;
  const col=['#0b7a6b','#2e6fdb','#e0a100','#d64545','#7c4dbd','#e0701f','#12a4b8','#6b7a8c'];
  let a=0;
  const seg=d.gastos_por_categoria.map((c,i)=>{const s=a;a+=c.porcentaje;return `${col[i%8]} ${s}% ${Math.min(a,100)}%`}).join(',');
  const kpi=[['Saldo total',r.saldo_total],['Ingresos del mes',r.ingresos],['Gastos del mes',r.gastos],['Balance del mes',r.balance_mes],['Ahorrado en sobres',r.ahorrado_en_sobres]];
  $('#view').innerHTML=`
  <div class="card"><label>Mes <input type="month" id="mes" value="${mes}"></label></div>
  <div class="grid">${kpi.map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${money(v)}</div></div>`).join('')}</div>
  ${d.alertas.map(s=>`<div class="card alerta"><b>${esc(s.nombre)}</b> ya usó el ${s.uso}% de lo asignado <span class="tag ${s.semaforo}">${s.semaforo}</span></div>`).join('')}
  <div class="card"><h2>Gastos por categoría</h2>${d.gastos_por_categoria.length?`<div class="row"><div class="pie" style="background:conic-gradient(${seg})"></div><div>${d.gastos_por_categoria.map((c,i)=>`<div><span class="dot" style="background:${col[i%8]}"></span>${esc(c.nombre)}: ${money(c.total)} (${c.porcentaje}%)</div>`).join('')}</div></div>`:'<p class="k">Sin gastos en este mes.</p>'}</div>
  <div class="card"><h2>Progreso de sobres</h2>${d.sobres.length?d.sobres.map(s=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(s.nombre)}</b><span><span class="tag ${s.semaforo}">Uso ${s.uso}%</span> <span class="tag">${s.estado}</span></span></div><div class="bar" style="--c:${esc(s.color_etiqueta||'#0b7a6b')}"><i style="width:${Math.min(s.progreso,100)}%"></i></div><span class="k">${money(s.balance_actual)} de ${money(s.monto_objetivo)} (${s.progreso}%)</span></div>`).join(''):'<p class="k">Aún no tienes sobres.</p>'}</div>`;
  $('#mes').onchange=e=>{if(e.target.value){mes=e.target.value;go('dashboard')}};
}

/* ---------- Cuentas ---------- */
async function vCuentas(){
  const l=await api('/cuentas');C.cuentas=l;
  $('#view').innerHTML=`
  <div class="card"><h2>Nueva cuenta</h2><form id="fCuenta"><input name="nombre" placeholder="Nombre (ej. Efectivo, Banco)" required><input name="saldo" type="number" step="0.01" min="0" placeholder="Saldo inicial"><button>Crear cuenta</button></form></div>
  <div class="card"><h2>Mis cuentas</h2><div class="tw"><table><tr><th>Nombre</th><th>Saldo</th><th></th></tr>${l.map(c=>`<tr><td>${esc(c.nombre)}</td><td>${money(c.saldo)}</td><td><button class="s" data-a="renC" data-id="${c.id_cuenta}">Renombrar</button> <button class="d" data-a="delC" data-id="${c.id_cuenta}">Eliminar</button></td></tr>`).join('')}</table></div></div>`;
}
F.fCuenta=f=>run(async()=>{await api('/cuentas','POST',{nombre:f.nombre,saldo:Number(f.saldo||0)});await vCuentas()},'Cuenta creada');
A.renC=id=>{const c=C.cuentas.find(x=>x.id_cuenta==id),n=prompt('Nuevo nombre',c.nombre);if(n)run(async()=>{await api('/cuentas/'+id,'PUT',{nombre:n});await vCuentas()},'Cuenta actualizada')};
A.delC=id=>{if(confirm('¿Eliminar esta cuenta?'))run(async()=>{await api('/cuentas/'+id,'DELETE');await vCuentas()},'Cuenta eliminada')};

/* ---------- Sobres ---------- */
async function vSobres(){
  const l=await api('/sobres');C.sobres=l;
  $('#view').innerHTML=`
  <div class="card"><h2>Nuevo sobre</h2><form id="fSobre"><input name="nombre" placeholder="Nombre (ej. Viaje)" required><input name="monto_objetivo" type="number" step="0.01" min="0.01" placeholder="Meta" required><input name="fecha_limite" type="date" title="Fecha límite"><input name="color_etiqueta" type="color" value="#0b7a6b" title="Color"><button>Crear sobre</button></form></div>
  <div class="sobres">${l.map(s=>`<div class="env" style="--c:${esc(s.color_etiqueta||'#0b7a6b')}"><h3>${esc(s.nombre)}</h3><span class="tag">${s.estado}</span><div class="bar"><i style="width:${Math.min(s.progreso,100)}%"></i></div><div>${money(s.balance_actual)} de ${money(s.monto_objetivo)}</div>${s.fecha_limite?`<div class="k">Fecha límite: ${s.fecha_limite}</div>`:''}<p style="margin:10px 0 0"><button class="s" data-a="edS" data-id="${s.id_sobre}">Editar</button> <button class="d" data-a="delS" data-id="${s.id_sobre}">Eliminar</button></p></div>`).join('')||'<p class="k">Crea tu primer sobre para empezar a ahorrar.</p>'}</div>`;
}
F.fSobre=f=>run(async()=>{await api('/sobres','POST',{nombre:f.nombre,monto_objetivo:Number(f.monto_objetivo),fecha_limite:f.fecha_limite||null,color_etiqueta:f.color_etiqueta});await vSobres()},'Sobre creado');
A.edS=id=>{
  const s=C.sobres.find(x=>x.id_sobre==id),n=prompt('Nombre del sobre',s.nombre);if(!n)return;
  const m=Number(prompt('Meta',s.monto_objetivo));if(!m)return;
  run(async()=>{await api('/sobres/'+id,'PUT',{nombre:n,monto_objetivo:m,fecha_limite:s.fecha_limite,color_etiqueta:s.color_etiqueta});await vSobres()},'Sobre actualizado');
};
A.delS=id=>{if(confirm('¿Eliminar este sobre? Sus movimientos se conservan sin sobre.'))run(async()=>{await api('/sobres/'+id,'DELETE');await vSobres()},'Sobre eliminado')};

/* ---------- Movimientos ---------- */
function cats(sel){
  $('#cat').innerHTML=C.cat.filter(c=>c.tipo===$('#tipo').value).map(c=>`<option value="${c.id_categoria}">${esc(c.nombre)}</option>`).join('');
  if(sel)$('#cat').value=sel;
}
async function vMov(){
  const [t,cu,ca,so]=await Promise.all([api('/transacciones'),api('/cuentas'),api('/categorias'),api('/sobres')]);
  C.tx=t;C.cat=ca;editTx=null;
  $('#view').innerHTML=`
  <div class="card"><h2 id="tt">Nuevo movimiento</h2><form id="fTx">
    <select name="tipo" id="tipo"><option>Gasto</option><option>Ingreso</option></select>
    <input name="monto" type="number" step="0.01" min="0.01" placeholder="Monto" required>
    <input name="fecha" type="date" value="${hoy()}" required>
    <select name="id_cuenta">${cu.map(c=>`<option value="${c.id_cuenta}">${esc(c.nombre)}</option>`).join('')}</select>
    <select name="id_categoria" id="cat"></select>
    <select name="id_sobre"><option value="">Sin sobre</option>${so.map(s=>`<option value="${s.id_sobre}">${esc(s.nombre)}</option>`).join('')}</select>
    <input name="descripcion" placeholder="Descripción" maxlength="255">
    <button>Guardar movimiento</button><button type="button" class="s" id="cx" data-a="cancTx" hidden>Cancelar</button>
  </form></div>
  <div class="card"><h2>Historial</h2><div class="tw"><table><tr><th>Fecha</th><th>Tipo</th><th>Monto</th><th>Categoría</th><th>Cuenta</th><th>Sobre</th><th>Descripción</th><th></th></tr>${t.map(x=>`<tr><td>${x.fecha}</td><td class="${x.tipo==='Ingreso'?'in':'out'}">${x.tipo}</td><td>${money(x.monto)}</td><td>${esc(x.categoria)}</td><td>${esc(x.cuenta)}</td><td>${esc(x.sobre||'')}</td><td>${esc(x.descripcion||'')}</td><td><button class="s" data-a="edTx" data-id="${x.id_transaccion}">Editar</button> <button class="d" data-a="delTx" data-id="${x.id_transaccion}">Eliminar</button></td></tr>`).join('')}</table></div>${t.length?'':'<p class="k">Registra tu primer ingreso o gasto arriba.</p>'}</div>`;
  cats();
}
F.fTx=f=>run(async()=>{
  const b={tipo:f.tipo,monto:Number(f.monto),fecha:f.fecha,id_cuenta:Number(f.id_cuenta),id_categoria:Number(f.id_categoria),id_sobre:f.id_sobre?Number(f.id_sobre):null,descripcion:f.descripcion||null};
  if(editTx)await api('/transacciones/'+editTx,'PUT',b);else await api('/transacciones','POST',b);
  await vMov();
},'Movimiento guardado');
A.edTx=id=>{
  const t=C.tx.find(x=>x.id_transaccion==id),f=$('#fTx');
  editTx=id;f.tipo.value=t.tipo;cats(t.id_categoria);f.monto.value=t.monto;f.fecha.value=t.fecha;
  f.id_cuenta.value=t.id_cuenta;f.id_sobre.value=t.id_sobre||'';f.descripcion.value=t.descripcion||'';
  $('#tt').textContent='Editar movimiento';$('#cx').hidden=false;scrollTo(0,0);
};
A.cancTx=()=>run(vMov);
A.delTx=id=>{if(confirm('¿Eliminar este movimiento? Se revertirá su efecto en la cuenta y el sobre.'))run(async()=>{await api('/transacciones/'+id,'DELETE');await vMov()},'Movimiento eliminado')};

/* ---------- Administración ---------- */
async function vAdmin(){
  const [e,u,c]=await Promise.all([api('/admin/estadisticas'),api('/admin/usuarios'),api('/admin/categorias')]);C.cadm=c;
  $('#view').innerHTML=`
  <div class="grid">${[['Usuarios',e.usuarios],['Activos',e.activos],['Suspendidos',e.suspendidos],['Transacciones',e.transacciones]].map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}</div>
  <div class="card"><h2>Usuarios</h2><div class="tw"><table><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Movimientos</th><th></th></tr>${u.map(x=>`<tr><td>${esc(x.nombre)}</td><td>${esc(x.correo)}</td><td>${x.rol}</td><td><span class="tag ${x.activo?'verde':'rojo'}">${x.activo?'Activo':'Suspendido'}</span></td><td>${x.transacciones}</td><td>${x.id_usuario===me.id?'<span class="k">Tu cuenta</span>':`${x.activo?`<button class="s" data-a="susU" data-id="${x.id_usuario}">Suspender</button>`:`<button class="s" data-a="reaU" data-id="${x.id_usuario}">Reactivar</button>`} <button class="d" data-a="delU" data-id="${x.id_usuario}">Eliminar</button>`}</td></tr>`).join('')}</table></div></div>
  <div class="card"><h2>Categorías del sistema</h2><form id="fCat" style="margin-bottom:10px"><input name="nombre" placeholder="Nombre" required><select name="tipo"><option>Gasto</option><option>Ingreso</option></select><input name="icono" placeholder="Icono (opcional)"><button>Crear categoría</button></form>
  <div class="tw"><table><tr><th>Nombre</th><th>Tipo</th><th></th></tr>${c.map(x=>`<tr><td>${esc(x.nombre)}</td><td>${x.tipo}</td><td><button class="s" data-a="renCat" data-id="${x.id_categoria}">Renombrar</button> <button class="d" data-a="delCat" data-id="${x.id_categoria}">Eliminar</button></td></tr>`).join('')}</table></div></div>`;
}
const ad=(p,m,b,ok)=>run(async()=>{await api('/admin'+p,m,b);await vAdmin()},ok);
A.susU=id=>ad('/usuarios/'+id+'/estado','PATCH',{activo:false},'Usuario suspendido');
A.reaU=id=>ad('/usuarios/'+id+'/estado','PATCH',{activo:true},'Usuario reactivado');
A.delU=id=>{if(confirm('¿Eliminar al usuario y todos sus datos? No se puede deshacer.'))ad('/usuarios/'+id,'DELETE',null,'Usuario eliminado')};
F.fCat=f=>ad('/categorias','POST',{nombre:f.nombre,tipo:f.tipo,icono:f.icono||null},'Categoría creada');
A.renCat=id=>{const c=C.cadm.find(x=>x.id_categoria==id),n=prompt('Nuevo nombre',c.nombre);if(n)ad('/categorias/'+id,'PUT',{nombre:n,icono:c.icono},'Categoría actualizada')};
A.delCat=id=>{if(confirm('¿Eliminar esta categoría?'))ad('/categorias/'+id,'DELETE',null,'Categoría eliminada')};

/* ---------- Arranque ---------- */
if(token)run(async()=>{me=await api('/auth/me');me.id=me.id_usuario;start()});
</script>
</body>
</html>
